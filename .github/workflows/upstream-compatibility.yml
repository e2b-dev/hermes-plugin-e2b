name: Upstream compatibility

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies and Hermes main
        run: |
          python -m pip install --upgrade pip uv
          pip install -e '.[test]'
          git clone --depth 1 --branch main https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          echo "Testing against hermes-agent $(git -C /tmp/hermes-agent rev-parse HEAD)"
          # Hermes resolves some dependency conflicts with [tool.uv] overrides,
          # which uv applies only when run from the Hermes project directory.
          cd /tmp/hermes-agent && uv pip install --python "$(command -v python)" -e .
      - name: Tests
        run: pytest -q -m 'not live'
      - name: Plugin Doctor
        run: hermes plugins doctor . --ci
